<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀 프로젝트 기여도</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#screen">본문으로 건너뛰기</a>
  <div class="app">
    <aside class="side">
      <p class="brand">팀 프로젝트 기여도</p>
      <nav aria-label="주 메뉴">
        <ul class="nav-list">
          <li><button type="button" data-view="main" aria-current="page">메인</button></li>
          <li><button type="button" data-view="public">공개 프로젝트</button></li>
          <li id="nav-login"><button type="button" data-view="login">로그인</button></li>
          <li id="nav-manage" hidden>
            <button type="button" id="manage-toggle" class="nav-group" aria-expanded="false" aria-controls="manage-menu">관리</button>
            <ul class="submenu" id="manage-menu" hidden>
              <li><button type="button" data-view="account">설정</button></li>
              <li><button type="button" data-view="projects">프로젝트 관리</button></li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>
    <main id="screen" class="content" tabindex="-1">
      <h1>저장소 판단</h1>
      <p class="muted">불러오는 중입니다.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
